# Watchdog — emails you when a long-running job dies, and can auto-restart training.
#   python scripts/watchdog.py                 # run the loop (foreground)
#   python scripts/watchdog.py --test-mail     # send one test email and exit
#   python scripts/watchdog.py --once          # evaluate every check once and exit
#
# Credentials live in .env (gitignored) — see .env.example.

poll_seconds: 60          # how often to evaluate every check
fail_threshold: 3         # consecutive failed polls before a check is declared DOWN
                          # (3 x 60s = ~3 min of silence -> alert)
state_file: artifacts/watchdog_state.json
log_file: artifacts/watchdog.log
heartbeat_hours: 12       # also send a "still alive, all green" email this often (0 = off)

checks:
  # --- 40M ablation training run: COMPLETE 2026-09-11 (all 7 acceptance criteria
  #     passed, see artifacts/reports/ablation_40m_run_2026-09-11.md). Check disabled
  #     so the watchdog doesn't "restart" a finished run. Re-enable (rename to
  #     train_150m, point at the 150M run's checkpoint dir + config) once that run
  #     is launched.
  # - name: train_40m
  #   kind: file_fresh
  #   path: artifacts/checkpoints/ablation-40m-001/metrics.jsonl
  #   max_age_seconds: 240
  #   restart:
  #     cmd: "python -u scripts/train.py --config configs/train_40m.yaml --resume auto"
  #     cwd: "."
  #     log: artifacts/checkpoints/ablation-40m-001/restart.log
  #     cooldown_seconds: 900
  #     max_restarts: 4

  # --- local Ollama server (eval panels + youtube MT) ---
  - name: ollama
    kind: http_ok
    url: "http://localhost:11434/api/version"
    optional: true                       # not always meant to be up -> DOWN emails only after it was UP

  # --- YouTube caption crawl (only while it is meant to be running) ---
  - name: youtube_crawl
    kind: file_fresh
    path: artifacts/logs/yt_crawl.log
    max_age_seconds: 1800
    optional: true

  # --- food-blog crawl ---
  - name: blog_crawl
    kind: file_fresh
    path: artifacts/logs/blog_crawl.log
    max_age_seconds: 1800
    optional: true

  # --- Phase 2: per-dish canonical extraction (local qwen7b+gemma9b, hours-long) ---
  # Auto-restart DISABLED 2026-09-19: a Claude Code session now runs a 30-min cron
  # check that inspects process + log freshness + Ollama health directly and
  # relaunches cleanly when needed (with duplicate-process detection and orphan
  # llama-server.exe cleanup that this blind file_fresh restart doesn't do). With
  # both active, the watchdog's restart kept racing the cron's own relaunch and
  # spawning a second canon_extract_dishes.py on top of a perfectly healthy one
  # every ~30-40 min. Keeping the freshness *check* (still emails if truly stuck)
  # but not the auto-restart action. Re-enable the restart: block below if the
  # manual/cron monitoring stops.
  - name: canon_extract
    kind: file_fresh
    path: artifacts/logs/canon_extract_progress.json   # written every 10 docs
    max_age_seconds: 2400
    optional: true
