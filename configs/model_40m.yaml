# 40M ablation model  (baseline master_baseline.md §5.2)
# Purpose: cheap ablations (data mix, dropout, LR, curriculum steps) before 89M.
# Param count: ~40.5M total
name: food-slm-40m
arch: decoder_only_transformer

hidden_dim: 512
num_layers: 10
num_heads: 8           # head_dim = 64
num_kv_heads: 8
ffn_inner_dim: 1408    # SwiGLU, multiple of 64
activation: silu
ffn_type: swiglu

positional: rope
rope_theta: 10000.0

norm: rmsnorm
norm_position: pre
qk_norm: true
z_loss_weight: 1.0e-4

tie_embeddings: true
vocab_size: 16384

dropout: 0.1
attention_dropout: 0.0

max_seq_len: 2048
init: scaled_normal
