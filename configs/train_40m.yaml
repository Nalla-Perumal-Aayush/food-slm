# 40M ablation training run  (baseline Rev 8 / Documents/plan_40m_ablation.md)
# Purpose: LR calibration + 1K->2K->4K curriculum + at-scale data pipeline + long-run
# stability + depth-scaling signal (L=14). If clean -> skip 89M, go to 150M.
model_config: configs/model_40m.yaml
tokenizer: artifacts/tokenizers/corpus-16k      # retrained on the real corpus (plan_40m §D)
run_name: ablation-40m-001
seed: 1337

# --- data ---
shard_dir: data/corpus/40m       # sharded pack: train/shard_*.bin + val.bin + val/<source>.bin
sequence_length: 4096            # packed length; the curriculum feeds shorter windows

# --- context curriculum (plan_40m §F): [seq_len, until_fraction] ---
# 4K phase kept short (20% of steps) — enough to validate the 4K mechanics + VRAM on the
# 70 W card without spending ~2 days there; the full-length 4K phase runs at 150M.
curriculum:
  - [1024, 0.45]
  - [2048, 0.80]
  - [4096, 1.00]

# --- optimizer / schedule ---
precision: bf16
optimizer: adamw
# lr_sweep.py 2026-09-08 (800 steps @ seq 1024): tail-mean loss 5e-4=4.85, 8e-4=4.62,
# 1.5e-3=5.05; no divergence at any. 8e-4 wins (near the 15M's 6e-4 — LR barely shifted
# with the 3.5x size bump). artifacts/reports/lr_sweep_2026-09-08.json
lr: 8.0e-4
betas: [0.9, 0.95]
weight_decay: 0.1
grad_clip: 1.0
warmup_ratio: 0.02
lr_schedule: cosine
min_lr_ratio: 0.1

# --- batch ---
micro_batch_size: 8             # tune to VRAM at 4K (grad checkpointing on if needed)
grad_accum_steps: 16            # global batch = 128 sequences
# ~1.6B tokens: avg per-step = 128 * (0.45*1024 + 0.35*2048 + 0.20*4096) ~= 292k ->
# 5500 steps ~= 1.6B tokens (~1.4x Chinchilla-optimal for 53M). Real depth-scaling signal
# + a multi-thousand-step stability window. Measured throughput ~15-17k tok/s @ 70 W ->
# expected wall ~1.5 days (phase 3 at 4K is the slow part).
max_steps: 5500
gradient_checkpointing: true    # needed for the 4K phase on 16 GB

# --- io / logging ---
checkpoint_dir: artifacts/checkpoints/ablation-40m-001
checkpoint_every_steps: 500
keep_last_n: 3
save_best_on: val_loss
eval_every_steps: 500
eval_batches: 40
log_every_steps: 20
tracker: none
metrics_jsonl: true
spike_factor: 1.6

# --- acceptance checks (plan_40m §I5) ---
acceptance:
  runs_end_to_end: true            # 5500 steps, clean exit — PASSED 2026-09-11,
                                    # see artifacts/reports/ablation_40m_run_2026-09-11.md
  val_loss_monotone_to_5k: true    # no sustained regression through step 5000
  no_sustained_spikes: true        # isolated spikes ok; no divergence, <5 spike warnings
  curriculum_phases_ran: 3         # all three seq_len phases executed
  resume_bit_exact_across_phase: true  # verified by a stop/resume across a phase boundary
  lr_calibrated: true              # peak LR chosen by lr_sweep, not the placeholder
  leakage_scan_clean: true         # forbidden-entity scan over the corpus finds nothing
  # if all pass -> 89M rung is skipped, proceed to 150M
