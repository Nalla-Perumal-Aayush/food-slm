# South Indian cooking YouTube channels for the 150M domain corpus (Level 1, method B7).
# Used for spoken technique / ratio / troubleshooting narration that rarely appears in
# written recipes. Transcripts only (no video/audio). English-language channels are
# ingested directly; regional-language channels (ml/ta/te/kn) have their auto-caption
# transcripts parked for a local machine-translation pass (scripts/translate_youtube_cache.py)
# because YouTube no longer exposes server-side translation for ASR captions.
#
# Openly published; transcripts used for weights only, NOT redistributed. Provenance
# (channel, video id, title, url, caption language, translated?) tracked in the manifest.
# Rate-limited. No GPU.
#
# handle: an @handle, a full https://www.youtube.com/... URL, or /channel/<ID>.
#         The crawler tries <url>/videos then <url>/streams and skips on failure.
# tier:   core_si (region-specific specialist) | pan_si (pan-South, English)

channels:
  # --- Tamil Nadu ---
  - {name: home_cooking_show,   handle: "@HomeCookingShow",                              region: tamil_nadu,     lang: en, tier: pan_si}
  - {name: madras_samayal,      handle: "@MadrasSamayal",                                region: tamil_nadu,     lang: ta, tier: core_si}
  - {name: cookd,               handle: "@cookdtv",                                      region: tamil_nadu,     lang: ta, tier: core_si}
  - {name: kannamma_cooks_yt,   handle: "@kannammacooks",                                region: tamil_nadu,     lang: en, tier: core_si}
