# Config B — LOCKED release architecture (baseline master_baseline.md §5.1, Rev 6)
# The final SLM is strictly ~150M parameters (accepted tolerance +/- 1-5%).
# Param count: ~151.2M total (~138.6M non-embedding + ~12.6M tied embedding at vocab 16384)
#   = +0.8% vs the 150M target. If the tokenizer benchmark locks vocab at 24k, trim
#     ffn_inner_dim -> 1792 or num_layers -> 19 to stay inside the tolerance band.
name: food-slm-150m
arch: decoder_only_transformer

hidden_dim: 768
num_layers: 20
num_heads: 12          # head_dim = 64
num_kv_heads: 12       # MHA (GQA benchmark dropped)
ffn_inner_dim: 1984    # SwiGLU, ~2.58 * hidden_dim, multiple of 64
activation: silu
ffn_type: swiglu

positional: rope
rope_theta: 10000.0

norm: rmsnorm
norm_position: pre
qk_norm: true
z_loss_weight: 1.0e-4

tie_embeddings: true
vocab_size: 16384      # set by tokenizer; keep in sync with configs/tokenizer.yaml

dropout: 0.1
attention_dropout: 0.0

max_seq_len: 4096      # final target; trained via 1K -> 2K -> 4K curriculum
init: scaled_normal    # std = 0.02, residual proj scaled by 1/sqrt(2*num_layers)
