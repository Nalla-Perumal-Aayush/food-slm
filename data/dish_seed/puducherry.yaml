  - {name: Karaikal Prawn Masala, cat: seafood_dish, diet: [seafood]}
  - {name: Nandu Kuzhambu / Crab Curry (Pondicherry), cat: seafood_dish, diet: [seafood]}
  - {name: Pondicherry Chicken Kuzhambu, cat: non_veg_curry, diet: [poultry]}
  - {name: Kizhi Parotta / Pondicherry Parotta, cat: bread, diet: veg}
  - {name: Pondicherry Mutton Biryani, cat: biryani, diet: [red_meat]}
